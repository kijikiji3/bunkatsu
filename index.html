<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>分割日記</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3.5' y='5' width='7' height='7' rx='2' fill='black'/%3E%3Crect x='13' y='4.5' width='7' height='7' rx='2' fill='black' transform='rotate(45 16.5 8)'/%3E%3Crect x='3.5' y='14' width='7' height='7' rx='2' fill='black'/%3E%3Crect x='13.5' y='14' width='7' height='7' rx='2' fill='black'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./timeline.css">
</head>
<body>
  <main class="app">
    <header class="composer">
      <div id="auth" class="auth-toolbar">
        <button id="signInBtn" class="auth-button" type="button">Googleでサインイン</button>
        <button id="addCategoryBtn" class="category-action" type="button" aria-label="カテゴリを追加" title="カテゴリを追加">＋</button>
        <button id="categoryTrashBtn" class="category-action" type="button" aria-label="カテゴリのゴミ箱" title="カテゴリのゴミ箱">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11H7L6 9Zm4 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/></svg>
        </button>
        <div class="progress-tools" aria-label="進捗表示の操作">
          <button id="progressAddBtn" class="progress-action" type="button" draggable="true" aria-label="進捗表示を追加" title="カードへドラッグして進捗表示を追加">＋</button>
          <button id="progressRemoveBtn" class="progress-action" type="button" draggable="true" aria-label="進捗表示を削除" title="カードへドラッグして進捗表示を削除">−</button>
        </div>
        <button id="resetPosBtn" class="auth-button" type="button">初期位置に戻す</button>
        <button id="signOutBtn" class="auth-button" type="button" style="display:none">サインアウト</button>
        <span id="userInfo" class="user-info" aria-live="polite"></span>
      </div>

    </header>

    <section id="timeline" class="timeline">
      <!-- entries go here -->
    </section>
  </main>

  <!-- Firebase (compat) SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- User must edit firebase-config.js with their project values -->
  <script src="./firebase-config.js"></script>
  <script src="./timeline.js"></script>
</body>
</html>
