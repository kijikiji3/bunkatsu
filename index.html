<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>タイムライン日記</title>
  <link rel="stylesheet" href="./timeline.css">
</head>
<body>
  <main class="app">
    <header class="composer">
      <div id="auth" style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem">
        <button id="signInBtn" type="button">Googleでサインイン</button>
        <button id="resetPosBtn" type="button" style="display:inline-block">初期位置に戻す</button>
        <button id="signOutBtn" type="button" style="display:none">サインアウト</button>
        <span id="userInfo" aria-live="polite" style="font-size:0.9rem;color:#333"></span>
      </div>

    </header>

    <section id="timeline" class="timeline">
      <!-- entries go here -->
    </section>
  </main>

  <!-- Firebase (compat) SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- User must edit firebase-config.js with their project values -->
  <script src="./firebase-config.js"></script>
  <script src="./timeline.js"></script>
</body>
</html>
